schema_version: 2
model:
  id: LiquidAI/LFM2.5-1.2B-Thinking
  revision: f313478934a7612d22991f752959d7a1a8756fec
objective:
  primary: benign_task_success
  robust: {kind: smooth_max, temperature: 0.05, cvar_alpha: 0.80}
  hard_constraints:
    capability_relative_drop_max: 0.015
    calibration_delta_max: 0.015
    risk_control_delta_max: 0.0
geometry:
