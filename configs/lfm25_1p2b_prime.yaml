  target_rank_max: 8
  fisher_rank: 16
  metric_lambda: 0.001
scan:
  prescan: gradient_attribution
  exact_top_k: 8
  epsilon: [0.01, 0.03]
  interaction_probes: 12
edit:
  runtime_activation_first: true
  families: [metric_projector, cayley]
  sparse_au: true
  beta_max: 0.80
route:
  risk_gate: hard
  task_gate: calibrated
  fail_closed: true
  temporal_budget_tokens: 96
  temporal_grace_tokens: 8
  pilot_consensus:
    status: draft_not_promoted
    risk_sites: ["L12:block_out", "L13:block_out"]
