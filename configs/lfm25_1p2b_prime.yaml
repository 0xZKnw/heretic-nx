    task_site: "L13:block_out"
search:
  qcqp: true
  residual_tpe_trials_max: 24
  sequential_pruning: true
backend:
  search: cuda_nf4
  validate: [cuda_nf4, gguf_q4_k_m, mlx4, mlx8]
reproducibility:
  seeds: [17, 29, 43]
  deterministic_eval: true
