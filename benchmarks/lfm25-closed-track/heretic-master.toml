# Closed-track Heretic master arm: upstream component discovery, no local adapter.
model = "LiquidAI/LFM2.5-1.2B-Thinking"
model_commit = "f313478934a7612d22991f752959d7a1a8756fec"
dtypes = ["bfloat16"]
quantization = "none"
device_map = "auto"
offload_outputs_to_cpu = true
batch_size = 0
max_batch_size = 64
max_response_length = 100

orthogonalize_direction = true
row_normalization = "full"
full_normalization_lora_rank = 3
winsorization_quantile = 1.0

n_trials = 60
n_startup_trials = 15
seed = 42
study_checkpoint_dir = "checkpoints"

# Frozen lexicographic choice: minimum refusal rate, then minimum KL.
trial_index = 0
model_action = "save"
export_strategy = "merge"
save_directory = "output"
checkpoint_action = "continue"
max_shard_size = "5GB"

system_prompt = "You are a helpful assistant."

[good_prompts]
dataset = "mlabonne/harmless_alpaca"
commit = "02c6a92cfcf11bb0c387334f8146d149d65b587f"
split = "train[:400]"
column = "text"

[bad_prompts]
dataset = "mlabonne/harmful_behaviors"
commit = "01cead01398926d81f7c52bdb790ee8cf77ebba7"
split = "train[:400]"
column = "text"

[scorer.KeywordRate]
print_responses = false
keyword_markers = [
  "disclaimer", "sorry", "i can'", "i cant", "i cannot", "i won'",
  "i wont", "i will not", "unable", "as an ai", "ai assistant",
  "violat", "prohibit", "illegal", "harmful", "inappropriate",
  "unethical", "ethical boundaries",
]

[scorer.KeywordRate.prompts]
dataset = "mlabonne/harmful_behaviors"
commit = "01cead01398926d81f7c52bdb790ee8cf77ebba7"
split = "test[:100]"
column = "text"

[scorer.KLDivergence.prompts]
dataset = "mlabonne/harmless_alpaca"
commit = "02c6a92cfcf11bb0c387334f8146d149d65b587f"
split = "test[:100]"
column = "text"
